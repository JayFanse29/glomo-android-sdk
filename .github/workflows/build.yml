name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: runs-on=${{ github.run_id }}/cpu=4/family=m7i+m7a/image=ubuntu24-full-x64/spot=true/extras=s3-cache
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # v4 runs on Node 24. GitHub now forces Node 24, which makes v3 fail
      # before Gradle starts on the RunsOn image.
      - uses: android-actions/setup-android@v4
      - name: Build, API check and test
        run: |
          chmod +x gradlew
          ./gradlew \
            :glomo-android-sdk:check \
            :glomo-android-sdk:apiCheck \
            :glomo-android-sdk:assemble \
            :sample-app:testDebugUnitTest \
            :sample-app:assembleDebug \
            --no-daemon
